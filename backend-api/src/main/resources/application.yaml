server:
  port: ${PORT:8080}

spring:
  application:
    name: backend-api
  thymeleaf:
    cache: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/condominio_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
    open-in-view: false
  ai:
    openai:
      api-key: ${AI_API_KEY:your_api_key}
      base-url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      chat:
        options:
          model: gemini-2.5-flash
          temperature: 0.4


seguridad:
  jwt:
    secreto: "${JWT_SECRETO:your_jwt_secret_key_must_be_very_long_for_security_purposes}"
    expiracion-minutos: 36000